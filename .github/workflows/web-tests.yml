name: Web app tests (IDS audit pipeline)

# Covers the web app / Pyodide / ifctester side only (no Revit or ArchiCAD code):
#   static   - tsc, svelte-check, biome, version consistency, production build
#   native   - desktop ifctester/ifcopenshell reference results for the fixtures
#   e2e      - headless Chromium runs the real worker (Pyodide + wasm ifcopenshell + ifctester)
#              and must reproduce the native reference results
#   drift    - weekly: newest released ifctester/ifcopenshell vs the reference, and shim watchdog
on:
  pull_request:
    paths:
      - 'web/**'
      - 'scripts/web/**'
      - '.github/workflows/web-tests.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/web/**'
      - '.github/workflows/web-tests.yml'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  static:
    name: Static checks + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: tsc, svelte-check, biome, version consistency
        run: npm run check
      - name: Production build
        run: npm run build

  native:
    name: Native ifctester reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web/tests/python/requirements.txt
      - run: pip install -r tests/python/requirements.txt
      - run: python -m pytest -q tests/python

  e2e:
    name: Pyodide audit (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Cache Python wheels for Pyodide
        uses: actions/cache@v5
        with:
          path: web/public/worker/bin
          key: worker-wheels-${{ hashFiles('web/src/config.json', 'web/scripts/download-packages.sh') }}
      - name: Download Python packages for Pyodide
        run: bash scripts/download-packages.sh
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npx playwright test
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  drift:
    name: Upstream drift (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Newest released ifctester/ifcopenshell must still match the reference
        run: |
          pip install -U ifctester ifcopenshell pytest
          pip list 2>/dev/null | grep -i -E "^(ifctester|ifcopenshell) "
          python -m pytest -q tests/python
      - name: Is the ifcopenshell compat shim still needed?
        run: python scripts/check-shim-needed.py
