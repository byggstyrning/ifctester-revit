name: Build Revit Plugin for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - fix/revit-installer-detection
    paths:
      - 'revit/**'
      - 'web/**'
      - 'installer/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'revit/**'
      - 'web/**'
      - 'installer/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from installer script
        id: version
        shell: pwsh
        run: |
          $issContent = Get-Content "installer\IfcTesterRevit.iss" -Raw
          if ($issContent -match '#define AppVersion "([^"]+)"') {
            $version = $Matches[1]
            Write-Host "Version: $version"
            "app_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Error "Could not extract version from IfcTesterRevit.iss"
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install web dependencies
        run: npm install
        working-directory: web

      - name: Download Python packages for Pyodide
        shell: pwsh
        run: |
          & web\scripts\download-packages.ps1

      - name: Build web app
        run: npm run build
        working-directory: web

      - name: Build Revit plugin (R25)
        run: dotnet build IfcTesterRevit.csproj -c "Release R25"
        working-directory: revit

      - name: Build Revit plugin (R26)
        run: dotnet build IfcTesterRevit.csproj -c "Release R26"
        working-directory: revit

      - name: Prepare installer staging
        shell: pwsh
        run: |
          $stagingDir = "installer\staging"

          # Clean and create staging directory
          if (Test-Path $stagingDir) { Remove-Item $stagingDir -Recurse -Force }
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null

          # Find the R25 publish output (Nice3point creates a publish directory)
          $r25PublishDir = "revit\bin\Release R25\publish"
          $publishAddinDir = Get-ChildItem -Path $r25PublishDir -Directory -Filter "*addin" | Select-Object -First 1

          if (-not $publishAddinDir) {
            Write-Error "Could not find R25 publish directory under $r25PublishDir"
            exit 1
          }

          Write-Host "Found publish dir: $($publishAddinDir.FullName)"

          # Copy plugin files to staging
          $stagingPluginDir = Join-Path $stagingDir "IfcTesterRevit"
          Copy-Item -Path "$($publishAddinDir.FullName)\IfcTesterRevit\*" -Destination $stagingPluginDir -Recurse -Force

          # Clean up unnecessary files
          Get-ChildItem -Path $stagingPluginDir -Filter "WebAec*" -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $stagingPluginDir -Filter "*.addin" -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue

          # Copy web app into staging
          $stagingWebDir = Join-Path $stagingPluginDir "web"
          New-Item -ItemType Directory -Path $stagingWebDir -Force | Out-Null
          Copy-Item -Path "web\dist\*" -Destination $stagingWebDir -Recurse -Force

          # Report staging contents
          $stats = Get-ChildItem $stagingDir -Recurse -File | Measure-Object -Property Length -Sum
          Write-Host "Staging: $($stats.Count) files, $([math]::Round($stats.Sum / 1MB, 2)) MB"

      - name: Generate .addin files
        shell: pwsh
        run: |
          $generatedDir = "installer\generated"
          if (-not (Test-Path $generatedDir)) {
            New-Item -ItemType Directory -Path $generatedDir -Force | Out-Null
          }

          $templatePath = "installer\templates\IfcTesterRevit.addin.template"
          $templateContent = Get-Content $templatePath -Raw

          # R25
          $r25Content = $templateContent -replace '\{ASSEMBLY_PATH\}', 'IfcTesterRevit\IfcTesterRevit.dll'
          $r25Content | Out-File -FilePath (Join-Path $generatedDir "IfcTesterRevit.2025.addin") -Encoding UTF8 -NoNewline
          Write-Host "Generated IfcTesterRevit.2025.addin"

          # R26
          $r26Content = $templateContent -replace '\{ASSEMBLY_PATH\}', 'IfcTesterRevit\IfcTesterRevit.dll'
          $r26Content | Out-File -FilePath (Join-Path $generatedDir "IfcTesterRevit.2026.addin") -Encoding UTF8 -NoNewline
          Write-Host "Generated IfcTesterRevit.2026.addin"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Inno Setup installed: $iscc"
          } else {
            Write-Error "Inno Setup installation failed"
            exit 1
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $issPath = "installer\IfcTesterRevit.iss"

          # Use a clean output directory so only the new installer is uploaded
          $outputDir = "installer-output"
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          Write-Host "Compiling installer..."
          & $iscc /O"$outputDir" "$issPath"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compilation failed with exit code $LASTEXITCODE"
            exit 1
          }

          # Show the generated installer
          $installer = Get-ChildItem -Path $outputDir -Filter "IfcTesterRevit-Setup-*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($installer) {
            Write-Host "Installer: $($installer.Name)"
            Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"
          } else {
            Write-Error "Installer file not found in $outputDir"
            exit 1
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: IfcTesterRevit-Setup-v${{ steps.version.outputs.app_version }}
          path: installer-output/IfcTesterRevit-Setup-*.exe
          retention-days: 30
