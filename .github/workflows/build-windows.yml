name: Build Windows Installers (Revit + Archicad)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - fix/revit-installer-detection
    paths:
      - 'revit/**'
      - 'archicad/**'
      - 'web/**'
      - 'installer/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'revit/**'
      - 'archicad/**'
      - 'web/**'
      - 'installer/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    name: Build Revit installer (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Read version from installer script
        id: version
        shell: pwsh
        run: |
          $issContent = Get-Content "installer\IfcTesterRevit.iss" -Raw
          if ($issContent -match '#define AppVersion "([^"]+)"') {
            $version = $Matches[1]
            Write-Host "Version: $version"
            "app_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Error "Could not extract version from IfcTesterRevit.iss"
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install web dependencies
        shell: cmd
        run: npm ci
        working-directory: web

      - name: Download Python packages for Pyodide
        shell: pwsh
        run: |
          & web\scripts\download-packages.ps1

      - name: Build web app
        shell: cmd
        run: npm run build
        working-directory: web

      - name: Build Revit plugin (R25)
        run: dotnet build IfcTesterRevit.csproj -c "Release R25"
        working-directory: revit

      - name: Build Revit plugin (R26)
        run: dotnet build IfcTesterRevit.csproj -c "Release R26"
        working-directory: revit

      - name: Prepare installer staging
        shell: pwsh
        run: |
          $stagingDir = "installer\staging"

          # Clean and create staging directory
          if (Test-Path $stagingDir) { Remove-Item $stagingDir -Recurse -Force }
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null

          # Find the R25 publish output (Nice3point creates a publish directory)
          $r25PublishDir = "revit\bin\Release R25\publish"
          $publishAddinDir = Get-ChildItem -Path $r25PublishDir -Directory -Filter "*addin" | Select-Object -First 1

          if (-not $publishAddinDir) {
            Write-Error "Could not find R25 publish directory under $r25PublishDir"
            exit 1
          }

          Write-Host "Found publish dir: $($publishAddinDir.FullName)"

          # Copy plugin files to staging (robocopy handles deep paths reliably;
          # exit codes 0-7 are success, >=8 is failure)
          $stagingPluginDir = Join-Path $stagingDir "IfcTesterRevit"
          $pluginSrc = "$($publishAddinDir.FullName)\IfcTesterRevit"
          robocopy "$pluginSrc" "$stagingPluginDir" /E /NJH /NJS /NFL /NDL /NP
          if ($LASTEXITCODE -ge 8) { Write-Error "robocopy failed with exit code $LASTEXITCODE"; exit 1 }

          # Clean up unnecessary files
          Get-ChildItem -Path $stagingPluginDir -Filter "WebAec*" -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $stagingPluginDir -Filter "*.addin" -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue

          # Copy web app into staging
          robocopy "web\dist" "$stagingPluginDir\web" /E /NJH /NJS /NFL /NDL /NP
          if ($LASTEXITCODE -ge 8) { Write-Error "robocopy failed with exit code $LASTEXITCODE"; exit 1 }
          $global:LASTEXITCODE = 0

          # Report staging contents
          $stats = Get-ChildItem $stagingDir -Recurse -File | Measure-Object -Property Length -Sum
          Write-Host "Staging: $($stats.Count) files, $([math]::Round($stats.Sum / 1MB, 2)) MB"

      - name: Generate .addin files
        shell: pwsh
        run: |
          $generatedDir = "installer\generated"
          if (-not (Test-Path $generatedDir)) {
            New-Item -ItemType Directory -Path $generatedDir -Force | Out-Null
          }

          $templatePath = "installer\templates\IfcTesterRevit.addin.template"
          $templateContent = Get-Content $templatePath -Raw

          # R25
          $r25Content = $templateContent -replace '\{ASSEMBLY_PATH\}', 'IfcTesterRevit\IfcTesterRevit.dll'
          $r25Content | Out-File -FilePath (Join-Path $generatedDir "IfcTesterRevit.2025.addin") -Encoding UTF8 -NoNewline
          Write-Host "Generated IfcTesterRevit.2025.addin"

          # R26
          $r26Content = $templateContent -replace '\{ASSEMBLY_PATH\}', 'IfcTesterRevit\IfcTesterRevit.dll'
          $r26Content | Out-File -FilePath (Join-Path $generatedDir "IfcTesterRevit.2026.addin") -Encoding UTF8 -NoNewline
          Write-Host "Generated IfcTesterRevit.2026.addin"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Inno Setup installed: $iscc"
          } else {
            Write-Error "Inno Setup installation failed"
            exit 1
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $issPath = "installer\IfcTesterRevit.iss"

          # Use a clean output directory so only the new installer is uploaded
          $outputDir = "installer-output"
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          Write-Host "Compiling installer..."
          & $iscc /O"$outputDir" "$issPath"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compilation failed with exit code $LASTEXITCODE"
            exit 1
          }

          # Show the generated installer
          $installer = Get-ChildItem -Path $outputDir -Filter "IfcTesterRevit-Setup-*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($installer) {
            Write-Host "Installer: $($installer.Name)"
            Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"
          } else {
            Write-Error "Installer file not found in $outputDir"
            exit 1
          }

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: IfcTesterRevit-Setup-v${{ steps.version.outputs.app_version }}
          path: installer-output/IfcTesterRevit-Setup-*.exe
          retention-days: 30

  build_archicad:
    name: Build Archicad installer (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Read version from Archicad installer script
        id: version
        shell: pwsh
        run: |
          $issContent = Get-Content "installer\IfcTesterArchiCAD.iss" -Raw
          if ($issContent -match '#define MyAppVersion "([^"]+)"') {
            $version = $Matches[1]
            Write-Host "Version: $version"
            "app_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Error "Could not extract version from IfcTesterArchiCAD.iss"
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install web dependencies
        shell: cmd
        run: npm ci
        working-directory: web

      - name: Download Python packages for Pyodide
        shell: pwsh
        run: |
          & web\scripts\download-packages.ps1

      - name: Build web app
        shell: cmd
        run: npm run build
        working-directory: web

      - name: Prepare Archicad API DevKit
        id: prepare_devkit
        shell: pwsh
        run: |
          $devKitPath = $env:ARCHICAD_API_DEVKIT

          if ($devKitPath -and (Test-Path (Join-Path $devKitPath "Support\Inc\ACAPinc.h"))) {
            Write-Host "Using DevKit from ARCHICAD_API_DEVKIT: $devKitPath"
          } else {
            $devKitPath = $null
            $possiblePaths = @(
              "C:\code\archicad-api\API.Development.Kit.WIN.29.3100",
              "C:\Program Files\GRAPHISOFT\API Development Kit 29",
              "C:\Program Files (x86)\GRAPHISOFT\API Development Kit 29",
              "$env:USERPROFILE\GRAPHISOFT\API Development Kit 29"
            )

            foreach ($path in $possiblePaths) {
              if (Test-Path $path) {
                $devKitPath = $path
                break
              }
            }
          }

          if (-not $devKitPath) {
            Write-Host "DevKit not found locally. Downloading from GRAPHISOFT releases..."

            $releaseApi = "https://api.github.com/repos/GRAPHISOFT/archicad-api-devkit/releases"
            $headers = @{
              "Accept" = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            if ($env:GITHUB_TOKEN) {
              $headers["Authorization"] = "Bearer $env:GITHUB_TOKEN"
            }

            $releases = Invoke-RestMethod -Uri $releaseApi -Headers $headers -Method Get
            $asset = $null

            foreach ($release in $releases) {
              if ($release.draft -or $release.prerelease) {
                continue
              }

              $match = $release.assets | Where-Object {
                $_.name -like "API.Development.Kit.WIN.29.*.zip"
              } | Select-Object -First 1

              if ($match) {
                $asset = $match
                break
              }
            }

            if (-not $asset) {
              Write-Error "Could not find a WIN.29 DevKit release asset in GRAPHISOFT/archicad-api-devkit."
              exit 1
            }

            $downloadDir = Join-Path $env:RUNNER_TEMP "archicad-devkit-download"
            $extractDir = Join-Path $env:RUNNER_TEMP "archicad-devkit"
            New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
            New-Item -ItemType Directory -Path $extractDir -Force | Out-Null

            $archivePath = Join-Path $downloadDir $asset.name
            Write-Host "Downloading: $($asset.name)"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archivePath

            Write-Host "Extracting DevKit archive..."
            Expand-Archive -Path $archivePath -DestinationPath $extractDir -Force

            $acapHeader = Get-ChildItem -Path $extractDir -Recurse -File -Filter "ACAPinc.h" |
              Where-Object { $_.FullName -like "*\Support\Inc\ACAPinc.h" } |
              Select-Object -First 1

            if (-not $acapHeader) {
              Write-Error "Downloaded DevKit did not contain Support\\Inc\\ACAPinc.h"
              exit 1
            }

            # ACAPinc.h is at .../Support/Inc/ACAPinc.h — DevKit root is parent of Support
            $devKitPath = Split-Path (Split-Path (Split-Path $acapHeader.FullName -Parent) -Parent) -Parent
            Write-Host "Downloaded DevKit extracted to: $devKitPath"
          }

          if (-not (Test-Path (Join-Path $devKitPath "Support\Inc\ACAPinc.h"))) {
            Write-Error "Invalid ArchiCAD DevKit path: $devKitPath"
            exit 1
          }

          Write-Host "Using DevKit: $devKitPath"
          "devkit_path=$devKitPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Configure CMake (ArchiCAD)
        shell: pwsh
        run: |
          cmake -B "archicad\Build" -S "archicad" `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -T v143 `
            -DAC_API_DEVKIT_DIR="${{ steps.prepare_devkit.outputs.devkit_path }}"

      - name: Build Archicad add-on
        shell: pwsh
        run: |
          cmake --build "archicad\Build" --config Release

      - name: Verify Archicad build output
        shell: pwsh
        run: |
          $output = "archicad\Build\Release\IfcTesterArchiCAD.apx"
          if (-not (Test-Path $output)) {
            Write-Error "Build output not found: $output"
            exit 1
          }

          $file = Get-Item $output
          Write-Host "Add-on: $($file.Name)"
          Write-Host "Size: $([math]::Round($file.Length / 1MB, 2)) MB"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Inno Setup installed: $iscc"
          } else {
            Write-Error "Inno Setup installation failed"
            exit 1
          }

      - name: Build Archicad installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $issPath = "installer\IfcTesterArchiCAD.iss"
          $outputDir = "installer-output-archicad"
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          Write-Host "Compiling Archicad installer..."
          & $iscc /O"$outputDir" "$issPath"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compilation failed with exit code $LASTEXITCODE"
            exit 1
          }

          $installer = Get-ChildItem -Path $outputDir -Filter "IfcTesterArchiCAD-Setup-win-v*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($installer) {
            Write-Host "Installer: $($installer.Name)"
            Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"
          } else {
            Write-Error "Installer file not found in $outputDir"
            exit 1
          }

      - name: Upload Archicad installer
        uses: actions/upload-artifact@v5
        with:
          name: IfcTesterArchiCAD-Setup-v${{ steps.version.outputs.app_version }}
          path: installer-output-archicad/IfcTesterArchiCAD-Setup-win-v*.exe
          retention-days: 30
